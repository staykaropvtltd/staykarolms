# deploy/nginx.conf
# Nginx reverse proxy for StayKaro LMS API (VPS / Docker Compose deployment).
# Terminates TLS, limits request rate, and forwards to the Node/PM2 cluster.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/staykaro-api
#   sudo ln -s /etc/nginx/sites-available/staykaro-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream staykaro_api {
    # PM2 binds a single port; Nginx forwards to it.
    # If running Docker Compose, replace 127.0.0.1:3001 with the service name: api:3001
    server 127.0.0.1:3001;
    keepalive 64;
}

# Rate-limit zone: 3 000 requests/min per IP (~50 req/s).
# Matches the in-process express-rate-limit default so both layers agree.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

server {
    listen 80;
    server_name _;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.staykaro.com;   # replace with your domain

    # TLS — managed by Certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/api.staykaro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.staykaro.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header Referrer-Policy         "strict-origin"   always;

    # ── Body limits ──────────────────────────────────────────────
    # Must match Express body-parser limits (15 MB standard, 150 MB upload).
    # Nginx rejects oversized requests before they hit Node.
    client_max_body_size 155m;

    # ── Timeouts ─────────────────────────────────────────────────
    # proxy_read_timeout must exceed Express's per-request 55 s timeout
    # so Nginx doesn't kill the connection before Express can return 503.
    proxy_read_timeout    65s;
    proxy_connect_timeout  5s;
    proxy_send_timeout    65s;

    # ── Keep-alive ───────────────────────────────────────────────
    # Must exceed Node's server.keepAliveTimeout (65 s) to prevent 502s
    # when Nginx reuses a connection that Node has already closed.
    keepalive_timeout  70s;

    # ── Rate limiting ────────────────────────────────────────────
    # Burst 200 — absorbs momentary spikes (e.g. 1 500 students refreshing
    # at once after login). nodelay prevents queuing (returns 429 immediately).
    limit_req zone=api_limit burst=200 nodelay;
    limit_req_status 429;

    # ── Proxy config ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://staykaro_api;
        proxy_http_version 1.1;

        # Forward real client IP so express rate-limit and logging work correctly
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for HTTP/1.1 keep-alive to the upstream
        proxy_set_header   Connection        "";
    }

    # ── Readiness / health (higher burst, no rate limit) ─────────
    location /api/ready {
        proxy_pass         http://staykaro_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        limit_req off;
    }

    location /api/health {
        proxy_pass         http://staykaro_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        limit_req off;
    }

    # ── Deny access outside /api ──────────────────────────────────
    location / {
        return 404;
    }
}
