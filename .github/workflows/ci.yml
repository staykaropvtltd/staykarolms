name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  backend:
    name: Backend — syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax check all route files
        working-directory: backend
        run: |
          node --check server.js
          for f in routes/*.js lib/*.js middleware/*.js; do node --check "$f"; done

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    # Skips gracefully when test-account secrets are not yet configured
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Check test credentials
        id: creds
        run: |
          if [ -z "${{ secrets.TEST_STUDENT_EMAIL }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::TEST_* secrets not set — skipping E2E tests. Add secrets to enable."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.creds.outputs.configured == 'true'
        run: pnpm exec playwright install chromium --with-deps

      - name: Install backend dependencies
        if: steps.creds.outputs.configured == 'true'
        working-directory: backend
        run: npm ci

      - name: Write env files
        if: steps.creds.outputs.configured == 'true'
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' \
            "${{ secrets.VITE_SUPABASE_URL }}" \
            "${{ secrets.VITE_SUPABASE_ANON_KEY }}" > .env
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_KEY=%s\nFRONTEND_URL=http://localhost:5173\nPORT=3001\n' \
            "${{ secrets.SUPABASE_URL }}" \
            "${{ secrets.SUPABASE_SERVICE_KEY }}" > backend/.env

      - name: Start backend
        if: steps.creds.outputs.configured == 'true'
        working-directory: backend
        run: node server.js &

      - name: Start frontend
        if: steps.creds.outputs.configured == 'true'
        run: pnpm dev &

      - name: Wait for servers
        if: steps.creds.outputs.configured == 'true'
        run: npx wait-on http://localhost:3001/api/health http://localhost:5173 --timeout 30000

      - name: Run smoke tests
        if: steps.creds.outputs.configured == 'true'
        run: pnpm exec playwright test
        env:
          TEST_BASE_URL: http://localhost:5173
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          TEST_FACULTY_EMAIL: ${{ secrets.TEST_FACULTY_EMAIL }}
          TEST_FACULTY_PASSWORD: ${{ secrets.TEST_FACULTY_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload test report on failure
        if: failure() && steps.creds.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
